name: refresh-made-in-china
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Refresh Made-in-China products
        run: python3 -u scripts/refresh_mic.py
      - name: Commit if changed
        run: |
          git config user.name "plus-suppliers-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add mic_status.json || true
          if ! git diff --quiet suppliers.json || ! git diff --cached --quiet; then
            git add suppliers.json
            git commit -m "refresh Made-in-China $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "no change"
          fi
